[project]
name = "dl-weather"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Jake Van Slyke", email = "jakervanslyke@gmail.com" }]
dependencies = [
    "netcdf4>=1.7.2",
    "numpy>=2.5.3",
    "pygrib>=2.1.8",
    "s3fs>=2026.9.0",
    "xarray>=2026.9.0",
]

[project.scripts]
dl-weather = "dl_weather:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "ty>=0.0.85",
]
